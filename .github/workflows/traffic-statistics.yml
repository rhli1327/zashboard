name: Build and Publish Traffic Statistics

on:
  push:
    branches:
      - traffic-statistics
    paths:
      - '.dockerignore'
      - '.github/workflows/traffic-statistics.yml'
      - 'Dockerfile'
      - 'env.d.ts'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'postcss.config.js'
      - 'public/**'
      - 'src/**'
      - 'tailwind.config.ts'
      - 'tsconfig*.json'
      - 'vendor/**'
      - 'vite.config.ts'
  workflow_dispatch:

concurrency:
  group: deploy-traffic-statistics
  cancel-in-progress: true

jobs:
  publish-dist:
    name: Publish traffic statistics dist.zip
    if: github.ref_name == 'traffic-statistics'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build
        run: |
          pnpm type-check
          pnpm build

      - name: Package dist
        run: zip -r dist.zip dist

      - name: Update traffic statistics rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force traffic-statistics-latest "$GITHUB_SHA"
          git push origin refs/tags/traffic-statistics-latest --force

          if gh release view traffic-statistics-latest >/dev/null 2>&1; then
            gh release upload traffic-statistics-latest dist.zip --clobber
            gh release edit traffic-statistics-latest \
              --title "Traffic statistics build" \
              --notes "Automatically built from the traffic-statistics branch." \
              --prerelease
          else
            gh release create traffic-statistics-latest dist.zip \
              --title "Traffic statistics build" \
              --notes "Automatically built from the traffic-statistics branch." \
              --prerelease
          fi

  publish-image:
    name: Publish traffic statistics container image
    if: github.ref_name == 'traffic-statistics'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish traffic statistics image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:traffic-statistics
          cache-from: type=gha
          cache-to: type=gha,mode=max
