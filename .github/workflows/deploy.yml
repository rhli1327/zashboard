name: Build and Publish

on:
  push:
    branches:
      - main
    paths:
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
      - 'Dockerfile'
      - 'env.d.ts'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'postcss.config.js'
      - 'public/**'
      - 'src/**'
      - 'tailwind.config.ts'
      - 'tsconfig*.json'
      - 'vendor/**'
      - 'vite.config.ts'
  workflow_dispatch:

jobs:
  publish-dist:
    name: Publish dist.zip
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build
        run: |
          pnpm type-check
          pnpm build

      - name: Package dist
        run: zip -r dist.zip dist

      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist.zip --clobber
            gh release edit latest \
              --title "Latest build" \
              --notes "Automatically built from the latest main branch." \
              --latest
          else
            gh release create latest dist.zip \
              --title "Latest build" \
              --notes "Automatically built from the latest main branch." \
              --latest
          fi

  publish-image:
    name: Publish container image
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish latest image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
