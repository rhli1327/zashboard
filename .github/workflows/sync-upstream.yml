name: Sync Upstream

on:
  schedule:
    - cron: '17 4 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

jobs:
  create-sync-pr:
    name: Create upstream sync PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge upstream into sync branch
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Zephyruso/zashboard.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch --force-create sync/upstream-main origin/main
          git merge --no-edit upstream/main
          git push --force-with-lease origin sync/upstream-main
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh pr list \
            --base main \
            --head sync/upstream-main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head sync/upstream-main \
              --title "chore: sync upstream main" \
              --body "Automated daily sync from Zephyruso/zashboard main. Review conflicts and local behavior before merging."
          fi
